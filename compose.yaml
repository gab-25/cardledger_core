services:
  cardledger:
    build: .
    image: ghcr.io/gab-25/cardledger_core:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardledger}
      POSTGRES_USER: ${POSTGRES_USER:-cardledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardledger}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-compose-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - media:/app/media  # uploaded files (the business logo)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    image: ghcr.io/gab-25/cardledger_core:local
    command: celery -A config worker --loglevel=info --concurrency=1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardledger}
      POSTGRES_USER: ${POSTGRES_USER:-cardledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardledger}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-local-compose-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      # Catalog files on S3: forwarded only when set.
      CARDLEDGER_CATALOG_BUCKET:
      CARDLEDGER_CATALOG_ENDPOINT:
      CARDLEDGER_CATALOG_REGION:
      CARDLEDGER_CATALOG_ACCESS_KEY_ID:
      CARDLEDGER_CATALOG_SECRET_ACCESS_KEY:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      cardledger:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardledger}
      POSTGRES_USER: ${POSTGRES_USER:-cardledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  media:
